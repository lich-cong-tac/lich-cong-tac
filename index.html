<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b2d5c">
<title>Lịch công tác</title>
<style>
:root{
  --navy:#0b2d5c;
  --blue:#0b4f91;
  --blue-soft:#e9f3ff;
  --gold:#d6a72b;
  --gold-soft:#fff5d9;
  --text:#172033;
  --muted:#687789;
  --line:#e4eaf1;
  --bg:#f5f7fa;
  --white:#fff;
  --red:#c62828;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
a,button{font:inherit}
.topbar{
  background:var(--navy);
  color:#fff;
  padding:17px 16px;
  box-shadow:0 3px 14px #0002;
}
.topbar-inner{
  max-width:720px;
  margin:auto;
  display:flex;
  align-items:center;
  gap:12px;
}
.calendar-mark{
  width:42px;
  height:42px;
  border:2px solid #fff;
  border-radius:10px;
  position:relative;
  flex:none;
}
.calendar-mark:before,
.calendar-mark:after{
  content:"";
  position:absolute;
  top:-5px;
  width:7px;
  height:11px;
  background:#fff;
  border-radius:5px;
}
.calendar-mark:before{left:8px}
.calendar-mark:after{right:8px}
.calendar-grid{
  position:absolute;
  left:8px;
  right:8px;
  top:15px;
  bottom:7px;
  background:
    linear-gradient(90deg,#fff 0 3px,transparent 3px 7px,#fff 7px 10px,transparent 10px 14px,#fff 14px 17px),
    linear-gradient(#fff 0 3px,transparent 3px 7px,#fff 7px 10px,transparent 10px 14px,#fff 14px 17px);
}
.brand-title{
  font-size:21px;
  font-weight:800;
  line-height:1.1;
}
.brand-sub{
  margin-top:4px;
  font-size:11px;
  color:#dce9f7;
}
.container{
  max-width:720px;
  margin:auto;
  padding:12px 12px 34px;
}
.loading{
  padding:70px 20px;
  text-align:center;
}
.spinner{
  width:40px;
  height:40px;
  margin:auto;
  border:4px solid #dce5ef;
  border-top-color:var(--blue);
  border-radius:50%;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{
  margin-top:14px;
  color:var(--muted);
  font-weight:600;
}
.error{
  display:none;
  background:#fff;
  border-left:5px solid var(--red);
  border-radius:14px;
  padding:20px;
  margin-top:20px;
  text-align:center;
}
.error strong{
  color:#a91f1f;
  font-size:18px;
}
.error p{
  color:var(--muted);
  font-size:14px;
}
.reload{
  border:0;
  background:var(--navy);
  color:#fff;
  border-radius:10px;
  padding:10px 16px;
  font-weight:700;
}
.section{margin-top:16px}
.section-head{
  display:flex;
  align-items:center;
  margin-bottom:9px;
}
.section-title{
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--navy);
  font-size:19px;
  font-weight:800;
  text-transform:uppercase;
}
.section-title:before{
  content:"";
  width:4px;
  height:20px;
  border-radius:5px;
  background:var(--gold);
}
.today-date{
  background:linear-gradient(90deg,#f7fbff,#fffdf7);
  border-radius:13px;
  padding:10px 12px;
  margin-bottom:10px;
  border:1px solid #e5ebf2;
}
.today-main{
  font-size:16px;
  font-weight:800;
  color:var(--navy);
}
.today-lunar{
  margin-top:3px;
  color:#7b8794;
  font-size:12px;
  font-weight:600;
}
.event{
  background:var(--white);
  border-radius:15px;
  margin-bottom:10px;
  padding:12px 11px;
  display:grid;
  grid-template-columns:68px minmax(0,1fr);
  gap:11px;
  box-shadow:0 3px 13px #0000000d;
  border-left:4px solid var(--blue);
}
.event.changed{border-left-color:var(--red)}
.event-time{
  font-size:21px;
  line-height:1.1;
  font-weight:800;
  color:var(--blue);
  min-height:58px;
  padding:8px 4px;
  background:var(--blue-soft);
  border:1px solid #dbe9f7;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  align-self:start;
}
.event-content{min-width:0}
.event-title{
  font-size:16px;
  line-height:1.38;
  font-weight:800;
  color:#172b48;
}
.event-meta{
  margin-top:6px;
  color:#526174;
  font-size:13px;
  line-height:1.45;
}
.event-meta div{margin-top:4px}
.event-note{
  margin-top:7px;
  background:var(--gold-soft);
  color:#896500;
  border-radius:8px;
  padding:7px 9px;
  font-size:12px;
  font-weight:600;
}
.status{
  display:inline-block;
  margin-top:7px;
  padding:4px 8px;
  border-radius:999px;
  background:#eaf6ee;
  color:#28753a;
  font-size:11px;
  font-weight:800;
}
.status.changed{
  background:#fdeaea;
  color:#b71c1c;
}
.actions{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:9px;
}
.action{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  text-decoration:none;
  border-radius:9px;
  padding:7px 10px;
  font-size:12px;
  font-weight:800;
  line-height:1.1;
}
.file{
  background:#edf5ff;
  color:var(--blue);
}
.prep{
  background:var(--gold-soft);
  color:#8a6500;
}
.week-box{margin-top:24px}
.week-head{
  display:flex;
  align-items:baseline;
  gap:9px;
  margin-bottom:9px;
}
.week-title{
  font-size:22px;
  font-weight:800;
  color:var(--navy);
  text-transform:uppercase;
}
.week-range{
  font-size:13px;
  color:var(--muted);
  font-weight:600;
}
.day-row{
  background:#fff;
  border:1px solid var(--line);
  border-radius:14px;
  margin-bottom:8px;
  overflow:hidden;
  box-shadow:0 2px 9px #00000008;
}
.day-row.today{
  border-color:#b9d5f2;
  box-shadow:0 3px 12px #0b4f9112;
}
.day-summary{
  display:grid;
  grid-template-columns:63px minmax(0,1fr) 20px;
  align-items:center;
  gap:10px;
  padding:11px 12px;
  cursor:pointer;
}
.day-date{
  font-weight:800;
  color:var(--blue);
  font-size:17px;
  line-height:1.05;
}
.day-date small{
  display:block;
  margin-top:3px;
  color:var(--muted);
  font-size:10px;
  font-weight:600;
}
.day-info{min-width:0}
.day-name{
  font-size:14px;
  font-weight:800;
  color:#25364d;
}
.day-meta{
  margin-top:3px;
  color:var(--muted);
  font-size:12px;
}
.day-today{
  display:inline-block;
  margin-left:5px;
  padding:3px 6px;
  background:var(--gold);
  color:#fff;
  border-radius:6px;
  font-size:9px;
  font-weight:800;
}
.chevron{
  color:#8190a2;
  font-size:18px;
  text-align:center;
  transition:transform .2s;
}
.day-row.open .chevron{transform:rotate(90deg)}
.day-details{
  display:none;
  padding:0 10px 10px;
  border-top:1px solid #edf1f5;
}
.day-row.open .day-details{display:block}
.day-details .event{
  margin:9px 0 0;
  box-shadow:none;
  background:#f9fbfd;
}
.empty-day{
  padding:11px 3px 4px;
  color:#9aa5b1;
  font-size:12px;
}
.footer{
  text-align:center;
  color:#8995a4;
  font-size:11px;
  padding:12px 10px 0;
}
@media(min-width:600px){
  .topbar{padding-left:24px;padding-right:24px}
  .brand-title{font-size:24px}
  .container{padding-left:18px;padding-right:18px}
  .event-title{font-size:18px}
  .event-meta{font-size:14px}
}
</style>
</head>

<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="calendar-mark"><div class="calendar-grid"></div></div>
    <div>
      <div class="brand-title">LỊCH CÔNG TÁC</div>
      <div class="brand-sub">Lịch điều hành của Lãnh đạo</div>
    </div>
  </div>
</header>

<main class="container">

  <div id="loading" class="loading">
    <div class="spinner"></div>
    <div class="loading-text">Đang tải lịch công tác...</div>
  </div>

  <div id="error" class="error">
    <strong>Không tải được lịch</strong>
    <p>Kết nối tới dữ liệu lịch công tác bị gián đoạn.</p>
    <button class="reload" onclick="loadSchedule()">↻ Tải lại lịch</button>
  </div>

  <div id="content" style="display:none">

    <section class="section">
      <div class="section-head">
        <div class="section-title">Hôm nay</div>
      </div>
      <div id="todayDate"></div>
      <div id="todayEvents"></div>
    </section>

    <section class="week-box">
      <div class="week-head">
        <div class="week-title">Tuần này</div>
        <div id="weekRange" class="week-range"></div>
      </div>
      <div id="weekCurrent"></div>
    </section>

    <section class="week-box">
      <div class="week-head">
        <div class="week-title">Tuần sau</div>
        <div id="nextRange" class="week-range"></div>
      </div>
      <div id="weekNext"></div>
    </section>

  </div>

  <div class="footer">Dữ liệu lịch được cập nhật tự động từ Google Sheet</div>
</main>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwnLLNPn7Vsxoqs9gOi0UH_iMtC_2it12QlHeBfUVyhiOalsnqyu9ga2u4OIVKN9WtJww/exec";

let scheduleData = [];
let callbackName = "";
let timer = null;

document.addEventListener("DOMContentLoaded", loadSchedule);

function loadSchedule(){
  document.getElementById("loading").style.display = "block";
  document.getElementById("error").style.display = "none";
  document.getElementById("content").style.display = "none";

  const old = document.getElementById("scheduleJsonp");
  if(old) old.remove();

  callbackName = "scheduleCallback_" + Date.now();

  window[callbackName] = function(data){
    clearTimeout(timer);
    scheduleData = Array.isArray(data) ? data : [];
    render();
    document.getElementById("loading").style.display = "none";
    document.getElementById("content").style.display = "block";
    cleanup();
  };

  const script = document.createElement("script");
  script.id = "scheduleJsonp";
  script.src = API_URL + "?callback=" + encodeURIComponent(callbackName) + "&t=" + Date.now();
  script.onerror = showError;

  document.body.appendChild(script);
  timer = setTimeout(showError, 10000);
}

function cleanup(){
  const script = document.getElementById("scheduleJsonp");
  if(script) script.remove();

  if(callbackName){
    try{
      delete window[callbackName];
    }catch(e){}
  }
}

function showError(){
  clearTimeout(timer);
  cleanup();
  document.getElementById("loading").style.display = "none";
  document.getElementById("error").style.display = "block";
}

function INT(x){
  return Math.floor(x);
}

function jdFromDate(dd,mm,yy){
  let a = INT((14-mm)/12);
  let y = yy + 4800 - a;
  let m = mm + 12*a - 3;
  let j = dd + INT((153*m+2)/5) + 365*y + INT(y/4) - INT(y/100) + INT(y/400) - 32045;

  if(j < 2299161){
    j = dd + INT((153*m+2)/5) + 365*y + INT(y/4) - 32083;
  }

  return j;
}

function NewMoon(k){
  const T = k/1236.85;
  const T2 = T*T;
  const T3 = T2*T;
  const dr = Math.PI/180;

  let J = 2415020.75933 + 29.53058868*k + 0.0001178*T2 - 0.000000155*T3;
  J += 0.00033*Math.sin((166.56+132.87*T-0.009173*T2)*dr);

  const M = 359.2242 + 29.10535608*k - 0.0000333*T2 - 0.00000347*T3;
  const Mp = 306.0253 + 385.81691806*k + 0.0107306*T2 + 0.00001236*T3;
  const F = 21.2964 + 390.67050646*k - 0.0016528*T2 - 0.00000239*T3;

  let C =
    (0.1734-0.000393*T)*Math.sin(M*dr)
    + 0.0021*Math.sin(2*M*dr)
    - 0.4068*Math.sin(Mp*dr)
    - 0.0161*Math.sin(2*Mp*dr)
    - 0.0004*Math.sin(3*Mp*dr)
    + 0.0104*Math.sin(2*F*dr)
    - 0.0051*Math.sin((M+Mp)*dr)
    - 0.0074*Math.sin((M-Mp)*dr)
    + 0.0004*Math.sin((2*F+M)*dr)
    - 0.0004*Math.sin((2*F-M)*dr)
    - 0.0006*Math.sin((2*F+Mp)*dr)
    + 0.001*Math.sin((2*F-Mp)*dr)
    + 0.0005*Math.sin((2*Mp+M)*dr);

  let dt;

  if(T < -11){
    dt = 0.001 + 0.000839*T + 0.0002261*T2 - 0.00000845*T3 - 0.000000081*T*T3;
  }else{
    dt = -0.000278 + 0.000265*T + 0.000262*T2;
  }

  return J + C - dt;
}

function SunLongitude(j){
  const T = (j-2451545)/36525;
  const T2 = T*T;
  const dr = Math.PI/180;

  const M = 357.5291 + 35999.0503*T - 0.0001559*T2 - 0.00000048*T*T2;
  const L0 = 280.46645 + 36000.76983*T + 0.0003032*T2;

  const DL =
    (1.9146-0.004817*T-0.000014*T2)*Math.sin(M*dr)
    + (0.019993-0.000101*T)*Math.sin(2*M*dr)
    + 0.00029*Math.sin(3*M*dr);

  let L = (L0 + DL)*dr;
  L = L - Math.PI*2*INT(L/(Math.PI*2));

  return INT(L/dr/30);
}

function getNewMoonDay(k,tz){
  return INT(NewMoon(k)+0.5+tz/24);
}

function getSunLongitude(day,tz){
  return INT(SunLongitude(day-0.5-tz/24));
}

function getLunarMonth11(y,tz){
  const off = jdFromDate(31,12,y)-2415021;
  const k = INT(off/29.530588853);
  let nm = getNewMoonDay(k,tz);

  if(getSunLongitude(nm,tz) >= 9){
    nm = getNewMoonDay(k-1,tz);
  }

  return nm;
}

function getLeapMonthOffset(a11,tz){
  const k = INT(0.5+(a11-2415021.076998695)/29.530588853);

  let last = 0;
  let i = 1;
  let arc = getSunLongitude(getNewMoonDay(k+i,tz),tz);

  do{
    last = arc;
    i++;
    arc = getSunLongitude(getNewMoonDay(k+i,tz),tz);
  }while(arc !== last && i < 15);

  return i-1;
}

function convertSolar2Lunar(dd,mm,yy,tz){
  const day = jdFromDate(dd,mm,yy);
  const k = INT((day-2415021.076998695)/29.530588853);

  let monthStart = getNewMoonDay(k+1,tz);

  if(monthStart > day){
    monthStart = getNewMoonDay(k,tz);
  }

  let a11 = getLunarMonth11(yy,tz);
  let b11 = a11;
  let lunarYear = yy;

  if(a11 >= monthStart){
    a11 = getLunarMonth11(yy-1,tz);
  }else{
    b11 = getLunarMonth11(yy+1,tz);
    lunarYear = yy+1;
  }

  const lunarDay = day-monthStart+1;
  const diff = INT((monthStart-a11)/29);
  const leap = (b11-a11 > 365);
  const leapDiff = leap ? getLeapMonthOffset(a11,tz) : 0;

  let lunarMonth = diff+11;
  let lunarLeap = false;

  if(leap && diff >= leapDiff){
    lunarMonth = diff+10;

    if(diff === leapDiff){
      lunarLeap = true;
    }
  }

  if(lunarMonth > 12){
    lunarMonth -= 12;
  }

  if(lunarMonth >= 11 && diff < 4){
    lunarYear -= 1;
  }

  return [lunarDay,lunarMonth,lunarYear,lunarLeap];
}

function lunarText(date){
  try{
    const l = convertSolar2Lunar(
      date.getDate(),
      date.getMonth()+1,
      date.getFullYear(),
      7
    );

    return String(l[0]).padStart(2,"0") + "/" +
           String(l[1]).padStart(2,"0") +
           (l[3] ? " nhuận" : "") +
           " ÂL";
  }catch(e){
    return "";
  }
}

function parseDate(value){
  if(!value) return null;

  const text = String(value).trim();
  let p = text.split("/");

  if(p.length === 3){
    let y = Number(p[2]);
    let m = Number(p[1])-1;
    let d = Number(p[0]);

    if(y < 100) y += 2000;

    return new Date(y,m,d);
  }

  p = text.split("-");

  if(p.length === 3){
    return new Date(Number(p[0]),Number(p[1])-1,Number(p[2]));
  }

  const d = new Date(text);
  return isNaN(d) ? null : d;
}

function key(date){
  return date.getFullYear() + "-" +
         String(date.getMonth()+1).padStart(2,"0") + "-" +
         String(date.getDate()).padStart(2,"0");
}

function fmt(date){
  return String(date.getDate()).padStart(2,"0") + "/" +
         String(date.getMonth()+1).padStart(2,"0") + "/" +
         date.getFullYear();
}

function dname(date){
  return [
    "Chủ nhật",
    "Thứ Hai",
    "Thứ Ba",
    "Thứ Tư",
    "Thứ Năm",
    "Thứ Sáu",
    "Thứ Bảy"
  ][date.getDay()];
}

function timeVal(value){
  const match = String(value || "").match(/(\d{1,2})\s*[:h]\s*(\d{1,2})/i);

  if(!match) return 99999;

  return Number(match[1])*60 + Number(match[2]);
}

function esc(value){
  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function changed(event){
  const status = String(event.status || "").toLowerCase();
  const note = String(event.note || "").toLowerCase();

  return status.includes("thay đổi") ||
         status.includes("thay doi") ||
         note.includes("đổi") ||
         note.includes("doi");
}

function validUrl(value){
  const u = String(value || "").trim();

  return /^https?:\/\//i.test(u) ? u : "";
}

function attachment(event){
  const u = validUrl(event.file);

  if(!u) return "";

  return '<a class="action file" href="' + esc(u) +
         '" target="_blank" rel="noopener">📎 Tài liệu</a>';
}

function prepLink(event){
  const u = validUrl(event.prep);

  if(!u) return "";

  return '<a class="action prep" href="' + esc(u) +
         '" target="_blank" rel="noopener">📑 Chuẩn bị</a>';
}

function sortedEvents(date){
  const dateKey = key(date);

  return scheduleData
    .filter(function(event){
      const d = parseDate(event.date);
      return d && key(d) === dateKey;
    })
    .sort(function(a,b){
      return timeVal(a.time) - timeVal(b.time);
    });
}

function eventHtml(event){
  const isChanged = changed(event);

  let html =
    '<article class="event ' + (isChanged ? "changed" : "") + '">' +
      '<div class="event-time">' + esc(event.time) + '</div>' +
      '<div class="event-content">' +
        '<div class="event-title">' + esc(event.title) + '</div>';

  if(event.place || event.people){
    html += '<div class="event-meta">';

    if(event.place){
      html += '<div>📍 ' + esc(event.place) + '</div>';
    }

    if(event.people){
      html += '<div>👥 ' + esc(event.people) + '</div>';
    }

    html += '</div>';
  }

  if(event.note){
    html += '<div class="event-note">📝 ' + esc(event.note) + '</div>';
  }

  if(event.status){
    html += '<span class="status ' +
      (isChanged ? "changed" : "") +
      '">' + esc(event.status) + '</span>';
  }

  const actions = attachment(event) + prepLink(event);

  if(actions){
    html += '<div class="actions">' + actions + '</div>';
  }

  html += '</div></article>';

  return html;
}

function monday(date){
  const d = new Date(date);
  const day = d.getDay();

  d.setDate(d.getDate() + (day === 0 ? -6 : 1-day));
  d.setHours(0,0,0,0);

  return d;
}

function addDays(date,n){
  const d = new Date(date);
  d.setDate(d.getDate()+n);
  return d;
}

function dayRow(date,open){
  const events = sortedEvents(date);
  const today = key(date) === key(new Date());

  let html =
    '<div class="day-row ' +
    (today ? "today " : "") +
    (open ? "open" : "") +
    '">' +

      '<div class="day-summary" onclick="toggleDay(this)">' +

        '<div class="day-date">' +
          String(date.getDate()).padStart(2,"0") + "/" +
          String(date.getMonth()+1).padStart(2,"0") +
          '<small>' + lunarText(date) + '</small>' +
        '</div>' +

        '<div class="day-info">' +
          '<div class="day-name">' +
            dname(date) +
            (today ? '<span class="day-today">HÔM NAY</span>' : '') +
          '</div>' +

          '<div class="day-meta">' +
            (events.length
              ? events.length + " lịch công tác"
              : "Không có lịch") +
          '</div>' +

        '</div>' +

        '<div class="chevron">›</div>' +

      '</div>' +

      '<div class="day-details">' +

        (events.length
          ? events.map(eventHtml).join("")
          : '<div class="empty-day">Chưa có lịch công tác.</div>') +

      '</div>' +

    '</div>';

  return html;
}

function toggleDay(element){
  element.parentElement.classList.toggle("open");
}

function render(){
  const now = new Date();
  const todayEvents = sortedEvents(now);

  document.getElementById("todayDate").innerHTML =
    '<div class="today-date">' +
      '<div class="today-main">' +
        dname(now) + " · " + fmt(now) +
      '</div>' +
      '<div class="today-lunar">' +
        lunarText(now) +
      '</div>' +
    '</div>';

  document.getElementById("todayEvents").innerHTML =
    todayEvents.length
      ? todayEvents.map(eventHtml).join("")
      : '<div class="today-date" style="text-align:center;color:#7b8794">' +
          'Hôm nay không có lịch công tác.' +
        '</div>';

  const currentMonday = monday(now);
  const nextMonday = addDays(currentMonday,7);

  document.getElementById("weekRange").textContent =
    fmt(currentMonday) + " – " + fmt(addDays(currentMonday,6));

  document.getElementById("nextRange").textContent =
    fmt(nextMonday) + " – " + fmt(addDays(nextMonday,6));

  const todayIndex = now.getDay() === 0 ? 6 : now.getDay()-1;

  document.getElementById("weekCurrent").innerHTML =
    Array.from({length:7},function(_,i){
      return dayRow(
        addDays(currentMonday,i),
        i === todayIndex
      );
    }).join("");

  document.getElementById("weekNext").innerHTML =
    Array.from({length:7},function(_,i){
      return dayRow(addDays(nextMonday,i),false);
    }).join("");
}
</script>
