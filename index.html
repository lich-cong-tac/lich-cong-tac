<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b2d5c">
<title>Lịch công tác</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#f4f7fb;color:#172033;font-family:"Be Vietnam Pro",Arial,sans-serif}
.header{background:linear-gradient(135deg,#082b59,#124d8f);color:#fff;text-align:center;padding:20px 15px;box-shadow:0 3px 12px #0002}
.header-title{font-size:28px;font-weight:800}.header-subtitle{margin-top:5px;font-size:13px;opacity:.9}
.container{max-width:1000px;margin:auto;padding:16px 13px}.section{margin-bottom:28px}
.loading{text-align:center;padding:70px 20px}.spinner{width:42px;height:42px;margin:auto auto 16px;border:4px solid #dce5ef;border-top-color:#0b4f91;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}.loading-text{font-size:18px;font-weight:600}
.error-box{display:none;background:#fff;margin:30px auto;padding:25px;border-radius:18px;border-left:6px solid #c62828;text-align:center;box-shadow:0 5px 18px #0001}
.error-title{font-size:22px;font-weight:800;color:#b71c1c}.error-text{font-size:16px;line-height:1.6;color:#666;margin:8px 0 17px}
.reload-btn{border:0;border-radius:12px;padding:13px 24px;background:#0b4f91;color:#fff;font:700 17px "Be Vietnam Pro";cursor:pointer}
.section-title{display:flex;align-items:center;gap:10px;margin-bottom:12px;color:#0b2d5c;font-size:25px;font-weight:800}
.section-title:before{content:"";width:6px;height:29px;border-radius:5px;background:#d4a72c}
.today-date{display:inline-block;background:#0b2d5c;color:#fff;padding:8px 12px;border-radius:9px;font-size:16px;font-weight:700;margin-bottom:12px}
.today-empty{background:#fff;border-radius:16px;padding:28px 20px;text-align:center;color:#777;font-size:17px;box-shadow:0 3px 12px #0001}
.event-card{background:#fff;border-radius:17px;margin-bottom:13px;padding:17px 14px;box-shadow:0 4px 15px #0001;border-left:5px solid #0b4f91}
.event-card.changed,.week-event.changed{border-left-color:#c62828}
.event-top{display:flex;gap:11px}.time-box{flex:0 0 auto;min-width:82px;padding:10px 5px;text-align:center;background:#edf4fb;color:#0b4f91;border-radius:11px;font-size:28px;font-weight:800}
.event-main{flex:1;min-width:0}.event-title{font-size:27px;line-height:1.35;font-weight:800}
.event-place{margin-top:8px;font-size:20px;line-height:1.45;color:#46556b}.event-people{margin-top:5px;font-size:18px;color:#5f6d7e}
.event-note{margin-top:8px;padding:9px 11px;background:#fff8e5;border-radius:9px;color:#8a6200;font-size:16px}
.status{display:inline-block;margin-top:9px;padding:5px 10px;border-radius:20px;font-size:13px;font-weight:700;background:#e9f6ed;color:#28753a}.status.changed{background:#fdeaea;color:#b71c1c}
.file-link{display:inline-flex;align-items:center;gap:7px;margin-top:10px;padding:8px 11px;border-radius:9px;background:#eef5ff;color:#0b4f91;text-decoration:none;font-size:15px;font-weight:700}
.file-link:hover{text-decoration:underline}.upload-link{display:inline-flex;align-items:center;gap:7px;margin-top:8px;margin-left:6px;padding:8px 11px;border-radius:9px;background:#fff4d6;color:#8a6500;text-decoration:none;font-size:15px;font-weight:700}.upload-link:hover{text-decoration:underline}
.week-block{margin-bottom:28px}.week-block-title{display:flex;align-items:baseline;gap:9px;margin-bottom:12px}
.week-block-title strong{font-size:24px;color:#0b2d5c}.week-block-title span{font-size:15px;color:#687789;font-weight:600}
.week-day{margin-bottom:18px}.week-day-header{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.week-date-box{width:58px;min-width:58px;height:58px;background:#0b2d5c;color:#fff;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.week-date-number{font-size:24px;font-weight:800}.week-date-month{font-size:11px}.week-date-lunar{font-size:10px;color:#b7d2ef;margin-top:2px}.today-lunar{font-size:14px;font-weight:600;opacity:.9}.week-day-name{font-size:23px;font-weight:800;color:#0b2d5c}
.week-today-label{margin-left:auto;background:#d4a72c;color:#fff;padding:5px 9px;border-radius:7px;font-size:12px;font-weight:800}
.week-event{background:#fff;border-radius:14px;margin-bottom:8px;padding:14px 12px;display:flex;gap:10px;box-shadow:0 3px 11px #0001;border-left:4px solid #0b4f91}
.week-time{flex:0 0 72px;font-size:22px;font-weight:800;color:#0b4f91}.week-content{flex:1;min-width:0}
.week-title{font-size:23px;line-height:1.4;font-weight:700}.week-place{margin-top:5px;font-size:19px;color:#5b6878}.week-note{margin-top:5px;color:#9a6a00;font-size:16px}
.footer{text-align:center;padding:15px 10px 30px;color:#7b8794;font-size:13px}
@media(max-width:430px){
  .header-title{font-size:26px}.event-title{font-size:25px}.event-place{font-size:19px}.time-box{min-width:76px;font-size:26px}
  .week-title{font-size:21px}.week-place{font-size:18px}.week-block-title strong{font-size:22px}
}
</style>

</head>
<body>
<header class="header">
  <div class="header-title">LỊCH CÔNG TÁC</div>
  <div class="header-subtitle">Lịch điều hành của Lãnh đạo</div>
</header>

<main class="container">
  <div id="loading" class="loading">
    <div class="spinner"></div>
    <div class="loading-text">Đang tải lịch công tác...</div>
  </div>

  <div id="errorBox" class="error-box">
    <div class="error-title">Không tải được lịch</div>
    <div class="error-text">Kết nối tới dữ liệu lịch công tác bị gián đoạn.</div>
    <button class="reload-btn" onclick="loadSchedule()">↻ Tải lại lịch</button>
  </div>

  <div id="content" style="display:none">
    <section class="section">
      <div class="section-title">Hôm nay</div>
      <div id="todayDate"></div>
      <div id="todayEvents"></div>
    </section>

    <section class="section">
      
      <div id="twoWeekEvents"></div>
    </section>
  </div>
</main>

<div class="footer">Lịch công tác được cập nhật từ hệ thống điều hành</div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbwnLLNPn7Vsxoqs9gOi0UH_iMtC_2it12QlHeBfUVyhiOalsnqyu9ga2u4OIVKN9WtJww/exec";
let scheduleData=[],callbackName=null,timeoutId=null;

document.addEventListener("DOMContentLoaded",loadSchedule);

function loadSchedule(){
  showLoading(); cleanup();
  callbackName="scheduleCallback_"+Date.now();
  window[callbackName]=function(data){
    clearTimeout(timeoutId);
    scheduleData=Array.isArray(data)?data:[];
    renderAll();
    document.getElementById("loading").style.display="none";
    document.getElementById("content").style.display="block";
    cleanup();
  };
  let s=document.createElement("script");
  s.id="scheduleJsonp";
  s.src=API_URL+"?callback="+encodeURIComponent(callbackName)+"&t="+Date.now();
  s.onerror=showError;
  document.body.appendChild(s);
  timeoutId=setTimeout(showError,10000);
}

function cleanup(){
  let s=document.getElementById("scheduleJsonp");
  if(s)s.remove();
  if(callbackName){try{delete window[callbackName]}catch(e){}}
}

function showLoading(){
  document.getElementById("loading").style.display="block";
  document.getElementById("errorBox").style.display="none";
  document.getElementById("content").style.display="none";
}

function showError(){
  clearTimeout(timeoutId);
  document.getElementById("loading").style.display="none";
  document.getElementById("errorBox").style.display="block";
  document.getElementById("content").style.display="none";
  cleanup();
}

function INT(d){
  return Math.floor(d);
}

function jdFromDate(dd,mm,yy){
  let a=INT((14-mm)/12);
  let y=yy+4800-a;
  let m=mm+12*a-3;
  let jd=dd+INT((153*m+2)/5)+365*y+INT(y/4)-INT(y/100)+INT(y/400)-32045;
  if(jd<2299161){
    jd=dd+INT((153*m+2)/5)+365*y+INT(y/4)-32083;
  }
  return jd;
}

function jdToDate(jd){
  let a,b,c,d,e,m;
  if(jd>2299160){
    a=jd+32044;
    b=INT((4*a+3)/146097);
    c=a-INT((b*146097)/4);
  }else{
    b=0;
    c=jd+32082;
  }
  d=INT((4*c+3)/1461);
  e=c-INT((1461*d)/4);
  m=INT((5*e+2)/153);
  return [
    e-INT((153*m+2)/5)+1,
    m+3-12*INT(m/10),
    b*100+ d-4800+INT(m/10)
  ];
}

function NewMoon(k){
  const T=k/1236.85;
  const T2=T*T;
  const T3=T2*T;
  const dr=Math.PI/180;
  let Jd1=2415020.75933+29.53058868*k+0.0001178*T2-0.000000155*T3;
  Jd1+=0.00033*Math.sin((166.56+132.87*T-0.009173*T2)*dr);
  const M=359.2242+29.10535608*k-0.0000333*T2-0.00000347*T3;
  const Mpr=306.0253+385.81691806*k+0.0107306*T2+0.00001236*T3;
  const F=21.2964+390.67050646*k-0.0016528*T2-0.00000239*T3;
  let C1=(0.1734-0.000393*T)*Math.sin(M*dr)+0.0021*Math.sin(2*M*dr);
  C1-=0.4068*Math.sin(Mpr*dr)+0.0161*Math.sin(2*Mpr*dr);
  C1-=0.0004*Math.sin(3*Mpr*dr);
  C1+=0.0104*Math.sin(2*F*dr)-0.0051*Math.sin((M+Mpr)*dr);
  C1-=0.0074*Math.sin((M-Mpr)*dr)+0.0004*Math.sin((2*F+M)*dr);
  C1-=0.0004*Math.sin((2*F-M)*dr)-0.0006*Math.sin((2*F+Mpr)*dr);
  C1+=0.0010*Math.sin((2*F-Mpr)*dr)+0.0005*Math.sin((2*Mpr+M)*dr);
  let deltat;
  if(T<-11){
    deltat=0.001+0.000839*T+0.0002261*T2-0.00000845*T3-0.000000081*T*T3;
  }else{
    deltat=-0.000278+0.000265*T+0.000262*T2;
  }
  return Jd1+C1-deltat;
}

function SunLongitude(jdn){
  const T=(jdn-2451545.0)/36525;
  const T2=T*T;
  const dr=Math.PI/180;
  const M=357.52910+35999.05030*T-0.0001559*T2-0.00000048*T*T2;
  const L0=280.46645+36000.76983*T+0.0003032*T2;
  let DL=(1.914600-0.004817*T-0.000014*T2)*Math.sin(M*dr);
  DL+=(0.019993-0.000101*T)*Math.sin(2*M*dr)+0.000290*Math.sin(3*M*dr);
  let L=L0+DL;
  L=L*dr;
  L=L-Math.PI*2*INT(L/(Math.PI*2));
  return INT(L/dr/30);
}

function getNewMoonDay(k,timeZone){
  return INT(NewMoon(k)+0.5+timeZone/24);
}

function getSunLongitude(day,timeZone){
  return INT(SunLongitude(day-0.5-timeZone/24));
}

function getLunarMonth11(yy,timeZone){
  const off=jdFromDate(31,12,yy)-2415021;
  const k=INT(off/29.530588853);
  let nm=getNewMoonDay(k,timeZone);
  const sunLong=getSunLongitude(nm,timeZone);
  if(sunLong>=9){
    nm=getNewMoonDay(k-1,timeZone);
  }
  return nm;
}

function getLeapMonthOffset(a11,timeZone){
  const k=INT(0.5+(a11-2415021.076998695)/29.530588853);
  let last=0;
  let i=1;
  let arc=getSunLongitude(getNewMoonDay(k+i,timeZone),timeZone);
  do{
    last=arc;
    i++;
    arc=getSunLongitude(getNewMoonDay(k+i,timeZone),timeZone);
  }while(arc!==last && i<15);
  return i-1;
}

function convertSolar2Lunar(dd,mm,yy,timeZone){
  const dayNumber=jdFromDate(dd,mm,yy);
  const k=INT((dayNumber-2415021.076998695)/29.530588853);
  let monthStart=getNewMoonDay(k+1,timeZone);
  if(monthStart>dayNumber){
    monthStart=getNewMoonDay(k,timeZone);
  }
  let a11=getLunarMonth11(yy,timeZone);
  let b11=a11;
  let lunarYear=yy;
  if(a11>=monthStart){
    a11=getLunarMonth11(yy-1,timeZone);
    lunarYear=yy;
  }else{
    b11=getLunarMonth11(yy+1,timeZone);
    lunarYear=yy+1;
  }
  const lunarDay=dayNumber-monthStart+1;
  const diff=INT((monthStart-a11)/29);
  let lunarLeap=false;
  let lunarMonth=diff+11;
  if(b11-a11>365){
    const leapDiff=getLeapMonthOffset(a11,timeZone);
    if(diff>=leapDiff){
      lunarMonth=diff+10;
      if(diff===leapDiff){
        lunarLeap=true;
      }
    }
  }
  if(lunarMonth>12) lunarMonth-=12;
  if(lunarMonth>=11 && diff<4) lunarYear-=1;
  return [lunarDay,lunarMonth,lunarYear,lunarLeap];
}

function getLunarDate(d){
  try{
    return convertSolar2Lunar(
      d.getDate(),
      d.getMonth()+1,
      d.getFullYear(),
      7
    );
  }catch(e){
    return null;
  }
}

function lunarText(d){
  const l=getLunarDate(d);
  if(!l)return '';
  return String(l[0]).padStart(2,'0')+'/'+String(l[1]).padStart(2,'0')+(l[3]?' nhuận':'')+' ÂL';
}

function parseDate(v){
  if(!v)return null;
  let t=String(v).trim(),p=t.split("/");
  if(p.length===3){
    let y=+p[2],m=+p[1]-1,d=+p[0];
    if(y<100)y+=2000;
    return new Date(y,m,d);
  }
  p=t.split("-");
  if(p.length===3)return new Date(+p[0],+p[1]-1,+p[2]);
  let d=new Date(t);
  return isNaN(d)?null:d;
}

function dateKey(d){
  return d?d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"):"";
}
function formatDate(d){return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear()}
function dayName(d){return["Chủ nhật","Thứ Hai","Thứ Ba","Thứ Tư","Thứ Năm","Thứ Sáu","Thứ Bảy"][d.getDay()]}
function parseTime(v){let m=String(v||"").match(/(\d{1,2})\s*[:h]\s*(\d{1,2})/i);return m?+m[1]*60+ +m[2]:99999}
function changed(x){
  let s=String(x.status||"").toLowerCase(),n=String(x.note||"").toLowerCase();
  return s.includes("thay đổi")||s.includes("thay doi")||n.includes("đổi")||n.includes("doi");
}
function esc(v){
  return String(v||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}
function safeUrl(v){
  let u=String(v||"").trim();
  return /^https?:\/\//i.test(u)?u:"";
}
function attachmentHtml(x){
  let url=safeUrl(x.file);
  if(!url)return "";
  return '<a class="file-link" href="'+esc(url)+'" target="_blank" rel="noopener">📎 Xem tệp đính kèm</a>';
}

function uploadHtml(x){
  let qs='?upload=1&row='+encodeURIComponent(x.row||'')+'&date='+encodeURIComponent(x.date||'')+'&time='+encodeURIComponent(x.time||'')+'&title='+encodeURIComponent(x.title||'');
  let url=API_URL+qs;
  return '<a class="upload-link" href="'+esc(url)+'" target="_blank" rel="noopener">⬆️ Tải tệp lên</a>';
}

function renderAll(){renderToday();renderTwoWeeks()}

function renderToday(){
  let n=new Date(),k=dateKey(n);
  let e=scheduleData.filter(x=>{
    let d=parseDate(x.date);
    return d&&dateKey(d)===k;
  }).sort((a,b)=>parseTime(a.time)-parseTime(b.time));

  document.getElementById("todayDate").innerHTML=
    '<div class="today-date">'+
      '<span>'+dayName(n)+' • '+formatDate(n)+'</span>'+      '<span class="today-lunar">'+lunarText(n)+'</span>'+    '</div>';

  document.getElementById("todayEvents").innerHTML=
    e.length?e.map(todayEvent).join(""):'<div class="today-empty">Hôm nay không có lịch công tác.</div>';
}

function todayEvent(x){
  let c=changed(x);
  let h='<div class="event-card '+(c?"changed":"")+'"><div class="event-top"><div class="time-box">'+esc(x.time)+'</div><div class="event-main"><div class="event-title">'+esc(x.title)+'</div>';
  if(x.place)h+='<div class="event-place">📍 '+esc(x.place)+'</div>';
  if(x.people)h+='<div class="event-people">👥 '+esc(x.people)+'</div>';
  if(x.note)h+='<div class="event-note">📝 '+esc(x.note)+'</div>';
  if(x.status)h+='<div class="status '+(c?"changed":"")+'">'+esc(x.status)+'</div>';
  h+=attachmentHtml(x);
  h+=uploadHtml(x);
  return h+"</div></div></div>";
}

function monday(d){
  let x=new Date(d),n=x.getDay();
  x.setDate(x.getDate()+(n===0?-6:1-n));
  x.setHours(0,0,0,0);
  return x;
}

function renderTwoWeeks(){
  let first=monday(new Date()), second=new Date(first);
  second.setDate(first.getDate()+7);

  let h='<div class="week-block">'+
    '<div class="week-block-title"><strong>Tuần này</strong><span>'+formatDate(first)+' – '+formatDate(addDays(first,6))+'</span></div>';

  for(let i=0;i<7;i++){
    let d=addDays(first,i);
    h+=weekDay(d);
  }
  h+='</div>';

  h+='<div class="week-block">'+
    '<div class="week-block-title"><strong>Tuần sau</strong><span>'+formatDate(second)+' – '+formatDate(addDays(second,6))+'</span></div>';

  for(let i=0;i<7;i++){
    let d=addDays(second,i);
    h+=weekDay(d);
  }
  h+='</div>';

  document.getElementById("twoWeekEvents").innerHTML=h;
}

function addDays(d,n){
  let x=new Date(d);
  x.setDate(x.getDate()+n);
  return x;
}

function weekDay(d){
  let k=dateKey(d),tk=dateKey(new Date());
  let e=scheduleData.filter(x=>{
    let z=parseDate(x.date);
    return z&&dateKey(z)===k;
  }).sort((a,b)=>parseTime(a.time)-parseTime(b.time));

  let h='<div class="week-day"><div class="week-day-header">'+
    '<div class="week-date-box"><div class="week-date-number">'+d.getDate()+
    '</div><div class="week-date-month">THG '+(d.getMonth()+1)+'</div>'+          '<div class="week-date-lunar">'+lunarText(d)+'</div></div>'+
    '<div class="week-day-name">'+dayName(d)+'</div>';

  if(k===tk)h+='<div class="week-today-label">HÔM NAY</div>';
  h+='</div>';

  h+=e.length?e.map(weekEvent).join(""):'<div style="color:#9aa5b1;font-size:15px;padding:5px">Không có lịch</div>';
  return h+"</div>";
}

function weekEvent(x){
  let c=changed(x);
  let h='<div class="week-event '+(c?"changed":"")+'"><div class="week-time">'+esc(x.time)+'</div><div class="week-content"><div class="week-title">'+esc(x.title)+'</div>';
  if(x.place)h+='<div class="week-place">📍 '+esc(x.place)+'</div>';
  if(x.note)h+='<div class="week-note">📝 '+esc(x.note)+'</div>';
  if(x.file)h+=attachmentHtml(x);
  h+=uploadHtml(x);
  return h+"</div></div>";
}
</script>
</body>
</html>
