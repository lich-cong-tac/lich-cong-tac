<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lịch công tác</title>

<style>
:root{
  --navy:#0a3f78;
  --navy2:#0e5a9c;
  --blue:#1674bd;
  --blue2:#eaf5ff;
  --bg:#eef5fb;
  --white:#fff;
  --text:#17324d;
  --muted:#6b7f93;
  --line:#d8e5f0;
  --red:#b3261e;
  --red2:#fff0ef;
  --shadow:0 8px 24px rgba(25,72,111,.08);
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:
    "Aptos",
    "Segoe UI",
    "Helvetica Neue",
    Arial,
    sans-serif;
  font-size:16px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

button,
a{
  font-family:inherit;
}

/* ================= HEADER ================= */

.top{
  background:linear-gradient(
    135deg,
    #08396d 0%,
    #0a4b88 58%,
    #0c5a99 100%
  );
  color:#fff;
  box-shadow:0 4px 16px rgba(18,57,91,.16);
}

.topin{
  width:min(1120px,100%);
  margin:auto;
  padding:20px 18px 18px;
}

.brand{
  display:flex;
  align-items:center;
  gap:16px;
  margin-bottom:18px;
}

.logo{
  width:64px;
  height:64px;
  border-radius:50%;
  background:#fff;
  padding:3px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex:none;
  box-shadow:0 2px 8px rgba(0,0,0,.14);
}

.logo img{
  width:100%;
  height:100%;
  object-fit:contain;
  border-radius:50%;
}

.title{
  font-size:34px;
  font-weight:800;
  letter-spacing:.1px;
  line-height:1.1;
}

/* ================= WEEK NAV ================= */

.weeknav{
  display:grid;
  grid-template-columns:1fr 1.08fr 1fr;
  gap:10px;
}

.weekbtn{
  min-height:52px;
  border:1px solid rgba(255,255,255,.7);
  border-radius:12px;
  background:rgba(255,255,255,.03);
  color:#fff;
  font-size:17px;
  font-weight:800;
  cursor:pointer;
  transition:.15s;
}

.weekbtn:hover{
  background:rgba(255,255,255,.1);
}

.weekbtn.current{
  background:#fff;
  color:var(--blue);
  border-color:#fff;
}

/* ================= MAIN ================= */

.wrap{
  width:min(1120px,100%);
  margin:auto;
  padding:20px 18px 48px;
}

.weekrange{
  text-align:center;
  color:#58738e;
  font-size:16px;
  font-weight:700;
  margin:2px 0 16px;
  letter-spacing:.1px;
}

/* ================= DAYS ================= */

.days{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:8px;
  margin-bottom:18px;
}

.day{
  background:#fff;
  border:1px solid var(--line);
  border-radius:13px;
  min-height:76px;
  padding:10px 4px;
  text-align:center;
  cursor:pointer;
  transition:.15s;
  box-shadow:0 2px 5px rgba(30,74,108,.03);
}

.day:hover{
  transform:translateY(-1px);
  border-color:#9fc5e5;
}

.day.today{
  border:2px solid #5b9dce;
}

.day.active{
  background:linear-gradient(
    180deg,
    #1b76ba,
    #1265a6
  );
  color:#fff;
  border-color:#1265a6;
  box-shadow:0 7px 16px rgba(19,100,166,.18);
}

.day .dow{
  font-size:12px;
  font-weight:900;
  opacity:.8;
}

.day .date{
  font-size:22px;
  font-weight:900;
  margin-top:5px;
}

/* ================= DAY HEADER ================= */

.head{
  background:#fff;
  border:1px solid var(--line);
  border-radius:16px;
  padding:16px 18px;
  margin-bottom:13px;
  box-shadow:var(--shadow);
}

.head-title{
  font-size:24px;
  font-weight:800;
  color:var(--navy);
  letter-spacing:.05px;
}

.head-sub{
  margin-top:4px;
  color:var(--muted);
  font-size:14px;
}

/* ================= EVENT ================= */

.event{
  display:grid;
  grid-template-columns:112px minmax(0,1fr);
  background:#fff;
  border:1px solid var(--line);
  border-radius:16px;
  overflow:hidden;
  margin-bottom:12px;
  box-shadow:var(--shadow);
}

.period{
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:13px 7px;
  border-right:1px solid var(--line);
}

.period.morning{
  background:var(--red2);
  color:var(--red);
}

.period.afternoon{
  background:var(--blue2);
  color:var(--blue);
}

.period-name{
  font-size:14px;
  font-weight:800;
  letter-spacing:.2px;
}

.time{
  font-size:27px;
  font-weight:800;
  margin-top:5px;
  white-space:nowrap;
  letter-spacing:.2px;
}

.ec{
  padding:15px 18px;
  min-width:0;
}

.ec-title{
  font-size:19px;
  line-height:1.42;
  font-weight:750;
  color:var(--text);
  letter-spacing:.05px;
}

.place{
  margin-top:7px;
  color:#587086;
  font-size:15px;
  line-height:1.45;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:11px;
}

.action{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:8px 11px;
  border-radius:9px;
  background:var(--blue2);
  color:var(--blue);
  text-decoration:none;
  font-size:13px;
  font-weight:900;
}

.action:hover{
  background:#dceeff;
}

/* ================= STATES ================= */

.loading,
.empty,
.error{
  background:#fff;
  border:1px solid var(--line);
  border-radius:16px;
  padding:28px 18px;
  text-align:center;
  color:var(--muted);
  font-size:16px;
  box-shadow:var(--shadow);
}

.error{
  color:#a61d1d;
  background:#fff8f8;
  border-color:#efcccc;
}

.footer{
  text-align:center;
  color:#8a9bad;
  font-size:12px;
  padding:0 0 22px;
}

/* ================= MOBILE ================= */

@media(max-width:700px){

  .topin{
    padding:15px 12px 14px;
  }

  .brand{
    gap:12px;
    margin-bottom:14px;
  }

  .logo{
    width:54px;
    height:54px;
  }

  .title{
    font-size:25px;
  }

  .weeknav{
    gap:6px;
  }

  .weekbtn{
    min-height:47px;
    font-size:14px;
    padding:0 4px;
    border-radius:10px;
  }

  .wrap{
    padding:14px 10px 42px;
  }

  .weekrange{
    font-size:15px;
    margin-bottom:12px;
  }

  .days{
    gap:4px;
    margin-bottom:13px;
  }

  .day{
    min-height:67px;
    padding:8px 2px;
    border-radius:10px;
  }

  .day .dow{
    font-size:10px;
  }

  .day .date{
    font-size:19px;
  }

  .head{
    padding:14px;
    border-radius:13px;
  }

  .head-title{
    font-size:21px;
  }

  .head-sub{
    font-size:13px;
  }

  .event{
    grid-template-columns:82px minmax(0,1fr);
    border-radius:13px;
  }

  .period{
    padding:11px 3px;
  }

  .period-name{
    font-size:12px;
  }

  .time{
    font-size:21px;
  }

  .ec{
    padding:13px 12px;
  }

  .ec-title{
    font-size:17px;
  }

  .place{
    font-size:14px;
  }

  .action{
    font-size:12px;
    padding:7px 9px;
  }
}
</style>
</head>

<body>

<header class="top">

  <div class="topin">

    <div class="brand">

      <div class="logo">
        <img
          src="Logo%20MTTQ%20(1).png"
          alt="Logo MTTQ Việt Nam"
        >
      </div>

      <div class="title">
        LỊCH CÔNG TÁC
      </div>

    </div>

    <div class="weeknav">

      <button
        class="weekbtn"
        onclick="moveWeek(-7)">
        ‹ Tuần trước
      </button>

      <button
        class="weekbtn current"
        onclick="goCurrentWeek()">
        Tuần hiện tại
      </button>

      <button
        class="weekbtn"
        onclick="moveWeek(7)">
        Tuần sau ›
      </button>

    </div>

  </div>

</header>


<main class="wrap">

  <div id="range" class="weekrange">
    Đang tải lịch công tác...
  </div>

  <div id="days" class="days"></div>

  <div id="head"></div>

  <div id="schedule">
    <div class="loading">
      Đang tải dữ liệu từ Google Sheet...
    </div>
  </div>

</main>


<div class="footer">
  Dữ liệu lịch được cập nhật tự động từ Google Sheet
</div>


<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbwnLLNPn7Vsxoqs9gOi0UH_iMtC_2it12QlHeBfUVyhiOalsnqyu9ga2u4OIVKN9WtJww/exec";

let data = [];

let weekStart =
  monday(new Date());

let selectedDate =
  new Date();


/* ================= LOAD ================= */

function load(){

  const old =
    document.getElementById("jsonp");

  if(old){
    old.remove();
  }

  const callback =
    "lichCallback_" + Date.now();

  window[callback] =
    function(result){

      data =
        Array.isArray(result)
          ? result
          : [];

      delete window[callback];

      const s =
        document.getElementById("jsonp");

      if(s){
        s.remove();
      }

      render();

    };


  const s =
    document.createElement("script");

  s.id = "jsonp";

  s.src =
    API_URL +
    "?callback=" +
    callback +
    "&t=" +
    Date.now();


  s.onerror =
    function(){

      delete window[callback];

      showError(
        "Không kết nối được với dữ liệu lịch. Vui lòng tải lại trang."
      );

    };


  document.body.appendChild(s);

}


/* ================= DATE ================= */

function monday(d){

  const x =
    new Date(d);

  x.setHours(
    0,0,0,0
  );

  const n =
    x.getDay();

  x.setDate(
    x.getDate() +
    (n === 0 ? -6 : 1-n)
  );

  return x;

}


function addDays(d,n){

  const x =
    new Date(d);

  x.setDate(
    x.getDate() + n
  );

  return x;

}


function key(d){

  return d.getFullYear()
    + "-"
    + String(
        d.getMonth()+1
      ).padStart(2,"0")
    + "-"
    + String(
        d.getDate()
      ).padStart(2,"0");

}


/* ================= PARSE DATE ================= */

function parseDate(v){

  if(!v){
    return null;
  }

  const p =
    String(v)
      .trim()
      .split("/");

  if(p.length === 3){

    return new Date(
      Number(p[2]),
      Number(p[1])-1,
      Number(p[0])
    );

  }

  const d =
    new Date(v);

  return isNaN(d)
    ? null
    : d;

}


/* ================= FORMAT ================= */

function formatDate(d){

  return String(
    d.getDate()
  ).padStart(2,"0")
  + "/"
  + String(
    d.getMonth()+1
  ).padStart(2,"0")
  + "/"
  + d.getFullYear();

}


function shortDate(d){

  return String(
    d.getDate()
  ).padStart(2,"0")
  + "/"
  + String(
    d.getMonth()+1
  ).padStart(2,"0");

}


function formatTime(v){

  if(!v){
    return "";
  }

  const m =
    String(v).match(
      /(\d{1,2})\s*[:h]\s*(\d{1,2})/i
    );

  if(m){

    return String(
      m[1]
    ).padStart(2,"0")
    + ":"
    + String(
      m[2]
    ).padStart(2,"0");

  }

  return String(v);

}


function timeMinutes(v){

  const m =
    String(v || "")
      .match(
        /(\d{1,2})\s*[:h]\s*(\d{1,2})/i
      );

  return m
    ? Number(m[1])*60 + Number(m[2])
    : 9999;

}


/* ================= DAYS ================= */

const DOW =
[
  "CN",
  "T2",
  "T3",
  "T4",
  "T5",
  "T6",
  "T7"
];


function eventsOn(d){

  const k =
    key(d);

  return data
    .filter(function(x){

      const z =
        parseDate(x.date);

      return z &&
        key(z) === k;

    })
    .sort(function(a,b){

      return timeMinutes(a.time)
        - timeMinutes(b.time);

    });

}


/* ================= RENDER ================= */

function render(){

  renderRange();

  renderDays();

  renderSelectedDay();

}


function renderRange(){

  const e =
    addDays(
      weekStart,
      6
    );

  document.getElementById(
    "range"
  ).textContent =
    "Tuần "
    + shortDate(weekStart)
    + " – "
    + shortDate(e)
    + "/"
    + e.getFullYear();

}


/* ================= DAYS ================= */

function renderDays(){

  const box =
    document.getElementById("days");

  box.innerHTML = "";

  for(
    let i=0;
    i<7;
    i++
  ){

    const d =
      addDays(
        weekStart,
        i
      );

    const div =
      document.createElement(
        "div"
      );

    const active =
      key(d) ===
      key(selectedDate);

    const today =
      key(d) ===
      key(new Date());

    div.className =
      "day"
      + (
        active
          ? " active"
          : ""
      )
      + (
        today
          ? " today"
          : ""
      );


    div.innerHTML =
      '<div class="dow">'
      + DOW[d.getDay()]
      + '</div>'
      + '<div class="date">'
      + d.getDate()
      + '</div>';


    div.onclick =
      function(){

        selectedDate =
          new Date(d);

        renderDays();

        renderSelectedDay();

        window.scrollTo({
          top:220,
          behavior:"smooth"
        });

      };


    box.appendChild(div);

  }

}


/* ================= SELECTED DAY ================= */

function renderSelectedDay(){

  const list =
    eventsOn(selectedDate);


  document.getElementById(
    "head"
  ).innerHTML =

    '<div class="head">'

    + '<div class="head-title">'
    + DOW[
        selectedDate.getDay()
      ]
    + " - "
    + formatDate(selectedDate)
    + '</div>'

    + '<div class="head-sub">'
    + lunarText(selectedDate)
    + '</div>'

    + '</div>';


  const box =
    document.getElementById(
      "schedule"
    );


  if(!list.length){

    box.innerHTML =
      '<div class="empty">'
      + 'Không có lịch công tác trong ngày này.'
      + '</div>';

    return;

  }


  box.innerHTML =
    list
      .map(eventHtml)
      .join("");

}


/* ================= EVENT ================= */

function eventHtml(x){

  const morning =
    timeMinutes(x.time) < 720;

  const period =
    morning
      ? "Sáng"
      : "Chiều";

  const cls =
    morning
      ? "morning"
      : "afternoon";


  let actions = "";


  if(isUrl(x.file)){

    actions +=
      '<a class="action" '
      + 'target="_blank" '
      + 'href="'
      + esc(x.file)
      + '">'
      + '📎 Tài liệu'
      + '</a>';

  }


  if(isUrl(x.prep)){

    actions +=
      '<a class="action" '
      + 'target="_blank" '
      + 'href="'
      + esc(x.prep)
      + '">'
      + '📑 Chuẩn bị'
      + '</a>';

  }


  return (

    '<article class="event">'

    + '<div class="period '
    + cls
    + '">'

    + '<div class="period-name">'
    + period
    + '</div>'

    + '<div class="time">'
    + esc(
        formatTime(x.time)
      )
    + '</div>'

    + '</div>'

    + '<div class="ec">'

    + '<div class="ec-title">'
    + esc(
        x.title || ""
      )
    + '</div>'

    + (
      x.place
        ? '<div class="place">'
          + '📍 '
          + esc(x.place)
          + '</div>'
        : ""
    )

    + (
      actions
        ? '<div class="actions">'
          + actions
          + '</div>'
        : ""
    )

    + '</div>'

    + '</article>'

  );

}


/* ================= LINKS ================= */

function isUrl(v){

  try{

    const u =
      new URL(
        String(v || "").trim()
      );

    return (
      u.protocol === "http:"
      ||
      u.protocol === "https:"
    );

  }catch(e){

    return false;

  }

}


/* ================= ESCAPE ================= */

function esc(v){

  return String(v || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* ================= WEEK ================= */

function moveWeek(n){

  weekStart =
    addDays(
      weekStart,
      n
    );

  selectedDate =
    new Date(weekStart);

  render();

}


function goCurrentWeek(){

  weekStart =
    monday(
      new Date()
    );

  selectedDate =
    new Date();

  render();

}


function showError(m){

  document.getElementById(
    "schedule"
  ).innerHTML =
    '<div class="error">'
    + esc(m)
    + '</div>';

}


/* ================= ÂM LỊCH ================= */

function INT(x){
  return Math.floor(x);
}


function jdFromDate(
  dd,
  mm,
  yy
){

  let a =
    INT(
      (14-mm)/12
    );

  let y =
    yy + 4800 - a;

  let m =
    mm + 12*a - 3;

  return dd
    + INT(
        (153*m+2)/5
      )
    + 365*y
    + INT(y/4)
    - INT(y/100)
    + INT(y/400)
    - 32045;

}


function getNewMoonDay(
  k,
  tz
){

  const T =
    k/1236.85;

  const T2 =
    T*T;

  const T3 =
    T2*T;

  const dr =
    Math.PI/180;

  let J =
    2415020.75933
    + 29.53058868*k
    + 0.0001178*T2
    - 0.000000155*T3;

  J +=
    0.00033 *
    Math.sin(
      (
        166.56
        + 132.87*T
        - 0.009173*T2
      ) * dr
    );


  const M =
    359.2242
    + 29.10535608*k
    - 0.0000333*T2
    - 0.00000347*T3;


  const Mp =
    306.0253
    + 385.81691806*k
    + 0.0107306*T2
    + 0.00001236*T3;


  const F =
    21.2964
    + 390.67050646*k
    - 0.0016528*T2
    - 0.00000239*T3;


  let C =
    (0.1734-0.000393*T)
      * Math.sin(M*dr)

    + 0.0021
      * Math.sin(2*M*dr)

    - 0.4068
      * Math.sin(Mp*dr)

    + 0.0161
      * Math.sin(2*Mp*dr)

    - 0.0004
      * Math.sin(3*Mp*dr)

    + 0.0104
      * Math.sin(2*F*dr)

    - 0.0051
      * Math.sin(
        (M+Mp)*dr
      )

    - 0.0074
      * Math.sin(
        (M-Mp)*dr
      )

    + 0.0004
      * Math.sin(
        (2*F+M)*dr
      )

    - 0.0004
      * Math.sin(
        (2*F-M)*dr
      )

    - 0.0006
      * Math.sin(
        (2*F+Mp)*dr
      )

    + 0.001
      * Math.sin(
        (2*F-Mp)*dr
      )

    + 0.0005
      * Math.sin(
        (2*Mp+M)*dr
      );


  let dt =
    T < -11

      ? 0.001
        + 0.000839*T
        + 0.0002261*T2
        - 0.00000845*T3
        - 0.000000081*T*T3

      : -0.000278
        + 0.000265*T
        + 0.000262*T2;


  return INT(
    J
    + C
    - dt
    + 0.5
    + tz/24
  );

}


function getSunLongitude(
  j,
  tz
){

  const T =
    (
      j
      - 2451545.5
      - tz/24
    ) / 36525;

  const T2 =
    T*T;

  const dr =
    Math.PI/180;


  const M =
    357.5291
    + 35999.0503*T
    - 0.0001559*T2
    - 0.00000048*T*T2;


  const L0 =
    280.46645
    + 36000.76983*T
    + 0.0003032*T2;


  let L =
    (
      L0

      + (
        1.9146
        - 0.004817*T
        - 0.000014*T2
      )
      * Math.sin(M*dr)

      + (
        0.019993
        - 0.000101*T
      )
      * Math.sin(2*M*dr)

      + 0.00029
      * Math.sin(3*M*dr)

    ) * dr;


  L =
    L
    - 2*Math.PI
    * INT(
      L/(2*Math.PI)
    );


  return INT(
    L/Math.PI*6
  );

}


function getLunarMonth11(
  y,
  tz
){

  const off =
    jdFromDate(
      31,
      12,
      y
    )
    - 2415021;

  const k =
    INT(
      off/29.530588853
    );

  let nm =
    getNewMoonDay(
      k,
      tz
    );


  if(
    getSunLongitude(
      nm,
      tz
    ) >= 9
  ){

    nm =
      getNewMoonDay(
        k-1,
        tz
      );

  }

  return nm;

}


function getLeapMonthOffset(
  a11,
  tz
){

  const k =
    INT(
      0.5
      + (
        a11
        - 2415021.076998695
      )
      / 29.530588853
    );


  let last = 0;

  let i = 1;

  let arc =
    getSunLongitude(
      getNewMoonDay(
        k+i,
        tz
      ),
      tz
    );


  do{

    last = arc;

    i++;

    arc =
      getSunLongitude(
        getNewMoonDay(
          k+i,
          tz
        ),
        tz
      );

  }while(
    arc !== last &&
    i < 14
  );


  return i-1;

}


function convertSolar2Lunar(
  dd,
  mm,
  yy,
  tz
){

  const day =
    jdFromDate(
      dd,
      mm,
      yy
    );


  const k =
    INT(
      (
        day
        - 2415021.076998695
      )
      / 29.530588853
    );


  let start =
    getNewMoonDay(
      k+1,
      tz
    );


  if(start > day){

    start =
      getNewMoonDay(
        k,
        tz
      );

  }


  let a11 =
    getLunarMonth11(
      yy,
      tz
    );

  let b11 =
    a11;

  let ly;


  if(a11 >= start){

    ly = yy;

    a11 =
      getLunarMonth11(
        yy-1,
        tz
      );

  }else{

    ly = yy+1;

    b11 =
      getLunarMonth11(
        yy+1,
        tz
      );

  }


  const ld =
    day - start + 1;


  const diff =
    INT(
      (start-a11)/29
    );


  const lm =
    diff + 11;


  let leap = 0;

  let month = lm;


  if(b11-a11 > 365){

    const leapDiff =
      getLeapMonthOffset(
        a11,
        tz
      );


    if(diff >= leapDiff){

      month =
        diff + 10;


      if(diff === leapDiff){

        leap = 1;

      }

    }

  }


  if(month > 12){

    month -= 12;

  }


  if(
    month >= 11 &&
    diff < 4
  ){

    ly--;

  }


  return [
    ld,
    month,
    ly,
    leap
  ];

}


function lunarText(d){

  try{

    const l =
      convertSolar2Lunar(
        d.getDate(),
        d.getMonth()+1,
        d.getFullYear(),
        7
      );


    return "Âm lịch: "
      + l[0]
      + "/"
      + l[1]
      + "/"
      + l[2];

  }catch(e){

    return "";

  }

}
