<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lịch công tác</title>

<style>
:root{
  --navy:#0b4b87;
  --navy-dark:#083b6d;
  --blue:#1769aa;
  --blue-soft:#eaf4ff;
  --bg:#f3f7fb;
  --white:#fff;
  --text:#17324f;
  --muted:#6b7f95;
  --line:#d8e4ef;
  --red:#b42318;
  --red-soft:#fdeeee;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:
    Arial,
    "Segoe UI",
    sans-serif;
}

/* ================= HEADER ================= */

.top{
  background:linear-gradient(135deg,var(--navy-dark),var(--navy));
  color:#fff;
  padding:22px 18px 20px;
}

.topin{
  width:min(100%,1000px);
  margin:auto;
}

.brand{
  display:flex;
  align-items:center;
  gap:16px;
  margin-bottom:18px;
}

.logo{
  width:68px;
  height:68px;
  border-radius:50%;
  background:#fff;
  border:2px solid #dcecff;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  flex:none;
}

.logo img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.logo-fallback{
  display:none;
  color:#0b4b87;
  font-size:9px;
  font-weight:800;
  line-height:1.1;
  text-align:center;
}

.title{
  font-size:36px;
  font-weight:900;
  letter-spacing:.2px;
}

/* ================= WEEK NAV ================= */

.weeknav{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
}

.weekbtn{
  min-height:54px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.75);
  background:transparent;
  color:#fff;
  font-size:18px;
  font-weight:800;
  cursor:pointer;
}

.weekbtn.current{
  background:#fff;
  color:var(--blue);
}

.weekbtn:active{
  transform:scale(.99);
}

/* ================= MAIN ================= */

.wrap{
  width:min(100%,1000px);
  margin:auto;
  padding:20px 14px 60px;
}

.weekrange{
  text-align:center;
  font-size:16px;
  color:var(--muted);
  font-weight:700;
  margin:4px 0 18px;
}

/* ================= DAYS ================= */

.days{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:7px;
  margin-bottom:20px;
}

.day{
  background:#fff;
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px 3px;
  text-align:center;
  cursor:pointer;
  min-height:74px;
}

.day:hover{
  border-color:#8db9df;
}

.day.active{
  background:var(--blue);
  color:#fff;
  border-color:var(--blue);
  box-shadow:0 4px 12px rgba(23,105,170,.18);
}

.day.today{
  border:2px solid var(--blue);
}

.day.active.today{
  border-color:#fff;
}

.day .dow{
  font-size:12px;
  font-weight:800;
  opacity:.8;
}

.day .date{
  font-size:20px;
  font-weight:900;
  margin-top:5px;
}

/* ================= SELECTED DAY ================= */

.head{
  background:#fff;
  border:1px solid var(--line);
  border-radius:16px;
  padding:17px 18px;
  margin-bottom:14px;
}

.head-title{
  font-size:24px;
  font-weight:900;
  color:var(--navy);
}

.head-sub{
  margin-top:5px;
  font-size:14px;
  color:var(--muted);
}

/* ================= EVENTS ================= */

.event{
  display:grid;
  grid-template-columns:105px minmax(0,1fr);
  background:#fff;
  border:1px solid var(--line);
  border-radius:16px;
  margin-bottom:12px;
  overflow:hidden;
  box-shadow:0 2px 8px rgba(21,54,87,.05);
}

.period{
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:14px 8px;
  border-right:1px solid var(--line);
  text-align:center;
}

.period.morning{
  background:var(--red-soft);
  color:var(--red);
}

.period.afternoon{
  background:var(--blue-soft);
  color:var(--blue);
}

.period-name{
  font-size:14px;
  font-weight:900;
}

.time{
  font-size:27px;
  font-weight:900;
  margin-top:5px;
  white-space:nowrap;
}

.ec{
  padding:16px 17px;
  min-width:0;
}

.ec-title{
  font-size:19px;
  line-height:1.4;
  font-weight:900;
  color:var(--text);
}

.place{
  margin-top:8px;
  font-size:15px;
  line-height:1.45;
  color:#52677e;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:12px;
}

.action{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:8px 11px;
  border-radius:9px;
  background:var(--blue-soft);
  color:var(--blue);
  text-decoration:none;
  font-size:14px;
  font-weight:800;
}

.action:hover{
  background:#dceeff;
}

/* ================= EMPTY / LOADING ================= */

.loading,
.empty,
.error{
  background:#fff;
  border:1px solid var(--line);
  border-radius:16px;
  padding:28px 18px;
  text-align:center;
  color:var(--muted);
  font-size:16px;
}

.error{
  color:#a61b1b;
  background:#fff7f7;
  border-color:#efcccc;
}

/* ================= FOOTER ================= */

.footer{
  text-align:center;
  color:#8a9aae;
  font-size:13px;
  padding:10px 0 20px;
}

/* ================= MOBILE ================= */

@media(max-width:600px){

  .top{
    padding:16px 12px 17px;
  }

  .brand{
    gap:12px;
    margin-bottom:15px;
  }

  .logo{
    width:54px;
    height:54px;
  }

  .title{
    font-size:25px;
  }

  .weeknav{
    gap:6px;
  }

  .weekbtn{
    min-height:48px;
    font-size:15px;
    padding:0 5px;
  }

  .wrap{
    padding:14px 10px 50px;
  }

  .weekrange{
    font-size:15px;
    margin:3px 0 13px;
  }

  .days{
    gap:4px;
    margin-bottom:14px;
  }

  .day{
    min-height:67px;
    padding:8px 2px;
    border-radius:10px;
  }

  .day .dow{
    font-size:10px;
  }

  .day .date{
    font-size:18px;
  }

  .head{
    padding:14px;
    border-radius:13px;
  }

  .head-title{
    font-size:21px;
  }

  .head-sub{
    font-size:13px;
  }

  .event{
    grid-template-columns:82px minmax(0,1fr);
    border-radius:13px;
  }

  .period{
    padding:12px 4px;
  }

  .period-name{
    font-size:12px;
  }

  .time{
    font-size:21px;
  }

  .ec{
    padding:13px 12px;
  }

  .ec-title{
    font-size:17px;
  }

  .place{
    font-size:14px;
  }

  .action{
    font-size:13px;
    padding:7px 9px;
  }
}
</style>
</head>

<body>

<header class="top">

  <div class="topin">

    <div class="brand">

      <div class="logo">
        <img
          src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/5a/Logo_MTTQ_Vi%E1%BB%87t_Nam.svg/240px-Logo_MTTQ_Vi%E1%BB%87t_Nam.svg.png"
          alt="MTTQ"
          onerror="this.style.display='none';this.nextElementSibling.style.display='block';"
        >
        <div class="logo-fallback">
          MẶT TRẬN<br>
          TQ<br>
          LÀO CAI
        </div>
      </div>

      <div class="title">
        LỊCH CÔNG TÁC
      </div>

    </div>

    <div class="weeknav">

      <button
        class="weekbtn"
        onclick="moveWeek(-7)">
        ‹ Tuần trước
      </button>

      <button
        class="weekbtn current"
        onclick="goCurrentWeek()">
        Tuần hiện tại
      </button>

      <button
        class="weekbtn"
        onclick="moveWeek(7)">
        Tuần sau ›
      </button>

    </div>

  </div>

</header>


<main class="wrap">

  <div id="range" class="weekrange">
    Đang tải lịch công tác...
  </div>

  <div id="days" class="days"></div>

  <div id="head"></div>

  <div id="schedule">
    <div class="loading">
      Đang tải dữ liệu từ Google Sheet...
    </div>
  </div>

</main>


<div class="footer">
  Dữ liệu lịch được cập nhật tự động từ Google Sheet
</div>


<script>

/* =========================================================
   GOOGLE APPS SCRIPT WEB APP
   ========================================================= */

const API_URL =
  "https://script.google.com/macros/s/AKfycbwnLLNPn7Vsxoqs9gOi0UH_iMtC_2it12QlHeBfUVyhiOalsnqyu9ga2u4OIVKN9WtJww/exec";


/* =========================================================
   BIẾN
   ========================================================= */

let data = [];

let weekStart = monday(new Date());

let selectedDate = new Date();


/* =========================================================
   LOAD DỮ LIỆU TỪ GOOGLE SHEET
   ========================================================= */

function load(){

  const old = document.getElementById("jsonp");

  if(old){
    old.remove();
  }

  const callback =
    "lichCallback_" + Date.now();

  window[callback] = function(result){

    try{

      data = Array.isArray(result)
        ? result
        : [];

      delete window[callback];

      const script =
        document.getElementById("jsonp");

      if(script){
        script.remove();
      }

      render();

    }catch(error){

      console.error(error);

      showError(
        "Không thể xử lý dữ liệu lịch công tác."
      );

    }

  };


  const script =
    document.createElement("script");

  script.id = "jsonp";

  script.src =
    API_URL +
    "?callback=" +
    callback +
    "&t=" +
    Date.now();


  script.onerror = function(){

    delete window[callback];

    showError(
      "Không kết nối được với Google Sheet. Vui lòng thử tải lại trang."
    );

  };


  document.body.appendChild(script);

}


/* =========================================================
   NGÀY - TUẦN
   ========================================================= */

function monday(date){

  const d = new Date(date);

  d.setHours(0,0,0,0);

  const day = d.getDay();

  const diff =
    day === 0
      ? -6
      : 1 - day;

  d.setDate(
    d.getDate() + diff
  );

  return d;

}


function addDays(date, number){

  const d = new Date(date);

  d.setDate(
    d.getDate() + number
  );

  return d;

}


function key(date){

  return [
    date.getFullYear(),
    String(date.getMonth()+1).padStart(2,"0"),
    String(date.getDate()).padStart(2,"0")
  ].join("-");

}


/* =========================================================
   ĐỌC NGÀY TỪ GOOGLE SHEET
   Hỗ trợ dd/MM/yyyy
   ========================================================= */

function parseDate(value){

  if(!value){
    return null;
  }

  const text =
    String(value).trim();

  const p =
    text.split("/");

  if(p.length === 3){

    return new Date(
      Number(p[2]),
      Number(p[1]) - 1,
      Number(p[0])
    );

  }

  const d =
    new Date(text);

  return isNaN(d)
    ? null
    : d;

}


/* =========================================================
   ĐỊNH DẠNG
   ========================================================= */

function formatDate(date){

  return String(date.getDate()).padStart(2,"0")
    + "/"
    + String(date.getMonth()+1).padStart(2,"0")
    + "/"
    + date.getFullYear();

}


function formatShort(date){

  return String(date.getDate()).padStart(2,"0")
    + "/"
    + String(date.getMonth()+1).padStart(2,"0");

}


function formatTime(value){

  if(!value){
    return "";
  }

  const text =
    String(value).trim();

  const match =
    text.match(/(\d{1,2})\s*[:h]\s*(\d{1,2})/i);

  if(match){

    return String(match[1]).padStart(2,"0")
      + ":"
      + String(match[2]).padStart(2,"0");

  }

  return text;

}


/* =========================================================
   THỨ
   ========================================================= */

const DOW = [
  "CN",
  "T2",
  "T3",
  "T4",
  "T5",
  "T6",
  "T7"
];


/* =========================================================
   NHÓM SỰ KIỆN
   ========================================================= */

function eventsOn(date){

  const k =
    key(date);

  return data
    .filter(item => {

      const d =
        parseDate(item.date);

      return d &&
        key(d) === k;

    })
    .sort((a,b) => {

      return timeMinutes(a.time)
        - timeMinutes(b.time);

    });

}


/* =========================================================
   TÍNH PHÚT
   ========================================================= */

function timeMinutes(value){

  const text =
    String(value || "");

  const m =
    text.match(/(\d{1,2})\s*[:h]\s*(\d{1,2})/i);

  if(!m){
    return 9999;
  }

  return Number(m[1]) * 60
    + Number(m[2]);

}


/* =========================================================
   TUẦN
   ========================================================= */

function render(){

  renderRange();

  renderDays();

  renderSelectedDay();

}


function renderRange(){

  const end =
    addDays(weekStart,6);

  document.getElementById("range").textContent =
    "Tuần " +
    formatShort(weekStart) +
    " – " +
    formatShort(end) +
    "/" +
    end.getFullYear();

}


/* =========================================================
   HIỂN THỊ 7 NGÀY
   ========================================================= */

function renderDays(){

  const box =
    document.getElementById("days");

  box.innerHTML = "";

  for(let i=0;i<7;i++){

    const d =
      addDays(weekStart,i);

    const div =
      document.createElement("div");

    const today =
      key(d) === key(new Date());

    const active =
      key(d) === key(selectedDate);

    div.className =
      "day"
      + (active ? " active" : "")
      + (today ? " today" : "");

    div.innerHTML =
      '<div class="dow">'
      + DOW[d.getDay()]
      + '</div>'
      + '<div class="date">'
      + d.getDate()
      + '</div>';

    div.onclick =
      function(){

        selectedDate =
          new Date(d);

        renderDays();

        renderSelectedDay();

        window.scrollTo({
          top:220,
          behavior:"smooth"
        });

      };

    box.appendChild(div);

  }

}


/* =========================================================
   NGÀY ĐANG CHỌN
   ========================================================= */

function renderSelectedDay(){

  const list =
    eventsOn(selectedDate);

  const head =
    document.getElementById("head");

  head.innerHTML =

    '<div class="head">'
    + '<div class="head-title">'
    + DOW[selectedDate.getDay()]
    + " - "
    + formatDate(selectedDate)
    + '</div>'
    + '<div class="head-sub">'
    + lunarText(selectedDate)
    + '</div>'
    + '</div>';


  const schedule =
    document.getElementById("schedule");


  if(list.length === 0){

    schedule.innerHTML =
      '<div class="empty">'
      + 'Không có lịch công tác trong ngày này.'
      + '</div>';

    return;

  }


  schedule.innerHTML =
    list.map(eventHtml).join("");

}


/* =========================================================
   HIỂN THỊ MỘT LỊCH
   ========================================================= */

function eventHtml(item){

  const minutes =
    timeMinutes(item.time);

  const morning =
    minutes < 720;

  const period =
    morning
      ? "Sáng"
      : "Chiều";

  const periodClass =
    morning
      ? "morning"
      : "afternoon";


  let actions = "";


  if(isUrl(item.file)){

    actions +=
      '<a class="action" target="_blank" href="'
      + escapeHtml(item.file)
      + '">📎 Tài liệu</a>';

  }


  if(isUrl(item.prep)){

    actions +=
      '<a class="action" target="_blank" href="'
      + escapeHtml(item.prep)
      + '">📑 Chuẩn bị</a>';

  }


  return (

    '<article class="event">'

      + '<div class="period '
      + periodClass
      + '">'

        + '<div class="period-name">'
        + period
        + '</div>'

        + '<div class="time">'
        + escapeHtml(formatTime(item.time))
        + '</div>'

      + '</div>'

      + '<div class="ec">'

        + '<div class="ec-title">'
        + escapeHtml(item.title || "")
        + '</div>'

        + (
          item.place
          ? '<div class="place">📍 '
            + escapeHtml(item.place)
            + '</div>'
          : ''
        )

        + (
          actions
          ? '<div class="actions">'
            + actions
            + '</div>'
          : ''
        )

      + '</div>'

    + '</article>'

  );

}


/* =========================================================
   KIỂM TRA LINK
   ========================================================= */

function isUrl(value){

  if(!value){
    return false;
  }

  try{

    const u =
      new URL(String(value).trim());

    return (
      u.protocol === "http:"
      ||
      u.protocol === "https:"
    );

  }catch(e){

    return false;

  }

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHtml(value){

  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================================
   CHUYỂN TUẦN
   ========================================================= */

function moveWeek(days){

  weekStart =
    addDays(weekStart,days);

  selectedDate =
    new Date(weekStart);

  render();

}


function goCurrentWeek(){

  weekStart =
    monday(new Date());

  selectedDate =
    new Date();

  render();

}


/* =========================================================
   LỖI
   ========================================================= */

function showError(message){

  document.getElementById("schedule").innerHTML =
    '<div class="error">'
    + escapeHtml(message)
    + '</div>';

}


/* =========================================================
   ÂM LỊCH
   ========================================================= */

function INT(x){

  return Math.floor(x);

}


function jdFromDate(dd,mm,yy){

  const a =
    INT((14-mm)/12);

  const y =
    yy + 4800 - a;

  const m =
    mm + 12*a - 3;

  return dd
    + INT((153*m+2)/5)
    + 365*y
    + INT(y/4)
    - INT(y/100)
    + INT(y/400)
    - 32045;

}


function jdToDate(jd){

  let a =
    jd + 32044;

  let b =
    INT((4*a+3)/146097);

  let c =
    a - INT((146097*b)/4);

  let d =
    INT((4*c+3)/1461);

  let e =
    c - INT((1461*d)/4);

  let m =
    INT((5*e+2)/153);

  let day =
    e - INT((153*m+2)/5) + 1;

  let month =
    m + 3 - 12*INT(m/10);

  let year =
    100*b + d - 4800 + INT(m/10);

  return [day,month,year];

}


function getNewMoonDay(k,timeZone){

  const T =
    k / 1236.85;

  const T2 =
    T*T;

  const T3 =
    T2*T;

  const dr =
    Math.PI/180;

  let Jd1 =
    2415020.75933
    + 29.53058868*k
    + 0.0001178*T2
    - 0.000000155*T3;

  Jd1 +=
    0.00033 *
    Math.sin(
      (166.56 + 132.87*T - 0.009173*T2)
      * dr
    );

  const M =
    359.2242
    + 29.10535608*k
    - 0.0000333*T2
    - 0.00000347*T3;

  const Mpr =
    306.0253
    + 385.81691806*k
    + 0.0107306*T2
    + 0.00001236*T3;

  const F =
    21.2964
    + 390.67050646*k
    - 0.0016528*T2
    - 0.00000239*T3;

  let C1 =
    (0.1734 - 0.000393*T)
      * Math.sin(M*dr)
    + 0.0021
      * Math.sin(2*M*dr)
    - 0.4068
      * Math.sin(Mpr*dr)
    + 0.0161
      * Math.sin(2*Mpr*dr)
    - 0.0004
      * Math.sin(3*Mpr*dr)
    + 0.0104
      * Math.sin(2*F*dr)
    - 0.0051
      * Math.sin((M+Mpr)*dr)
    - 0.0074
      * Math.sin((M-Mpr)*dr)
    + 0.0004
      * Math.sin((2*F+M)*dr)
    - 0.0004
      * Math.sin((2*F-M)*dr)
    - 0.0006
      * Math.sin((2*F+Mpr)*dr)
    + 0.0010
      * Math.sin((2*F-Mpr)*dr)
    + 0.0005
      * Math.sin((2*Mpr+M)*dr);

  let deltaT;

  if(T < -11){

    deltaT =
      0.001
      + 0.000839*T
      + 0.0002261*T2
      - 0.00000845*T3
      - 0.000000081*T*T3;

  }else{

    deltaT =
      -0.000278
      + 0.000265*T
      + 0.000262*T2;

  }

  const JdNew =
    Jd1
    + C1
    - deltaT;

  return INT(
    JdNew + 0.5 + timeZone/24
  );

}


function getSunLongitude(jdn,timeZone){

  const T =
    (jdn - 2451545.5 - timeZone/24)
    / 36525;

  const T2 =
    T*T;

  const dr =
    Math.PI/180;

  const M =
    357.52910
    + 35999.05030*T
    - 0.0001559*T2
    - 0.00000048*T*T2;

  const L0 =
    280.46645
    + 36000.76983*T
    + 0.0003032*T2;

  let DL =
    (1.914600 - 0.004817*T - 0.000014*T2)
      * Math.sin(M*dr)
    + (0.019993 - 0.000101*T)
      * Math.sin(2*M*dr)
    + 0.000290
      * Math.sin(3*M*dr);

  let L =
    (L0 + DL) * dr;

  L =
    L - Math.PI*2
      * INT(L/(Math.PI*2));

  return INT(
    L / Math.PI * 6
  );

}


function getLunarMonth11(year,timeZone){

  const off =
    jdFromDate(31,12,year)
    - 2415021;

  const k =
    INT(off/29.530588853);

  let nm =
    getNewMoonDay(k,timeZone);

  const sunLong =
    getSunLongitude(nm,timeZone);

  if(sunLong >= 9){

    nm =
      getNewMoonDay(k-1,timeZone);

  }

  return nm;

}


function getLeapMonthOffset(a11,timeZone){

  const k =
    INT(
      0.5
      + (a11 - 2415021.076998695)
      / 29.530588853
    );

  let last =
    0;

  let i =
    1;

  let arc =
    getSunLongitude(
      getNewMoonDay(k+i,timeZone),
      timeZone
    );

  do{

    last =
      arc;

    i++;

    arc =
      getSunLongitude(
        getNewMoonDay(k+i,timeZone),
        timeZone
      );

  }while(
    arc !== last &&
    i < 14
  );

  return i-1;

}


function convertSolar2Lunar(dd,mm,yy,timeZone){

  const dayNumber =
    jdFromDate(dd,mm,yy);

  const k =
    INT(
      (dayNumber - 2415021.076998695)
      / 29.530588853
    );

  let monthStart =
    getNewMoonDay(k+1,timeZone);

  if(monthStart > dayNumber){

    monthStart =
      getNewMoonDay(k,timeZone);

  }

  let a11 =
    getLunarMonth11(yy,timeZone);

  let b11 =
    a11;

  let lunarYear;

  if(a11 >= monthStart){

    lunarYear =
      yy;

    a11 =
      getLunarMonth11(
        yy-1,
        timeZone
      );

  }else{

    lunarYear =
      yy+1;

    b11 =
      getLunarMonth11(
        yy+1,
        timeZone
      );

  }

  const lunarDay =
    dayNumber
    - monthStart
    + 1;

  const diff =
    INT(
      (monthStart - a11)
      / 29
    );

  let lunarMonth =
    diff + 11;

  let lunarLeap =
    0;

  if(b11 - a11 > 365){

    const leapMonthDiff =
      getLeapMonthOffset(
        a11,
        timeZone
      );

    if(diff >= leapMonthDiff){

      lunarMonth =
        diff + 10;

      if(diff === leapMonthDiff){

        lunarLeap = 1;

      }

    }

  }

  if(lunarMonth > 12){

    lunarMonth -= 12;

  }

  if(lunarMonth >= 11 && diff < 4){

    lunarYear--;

  }

  return [
    lunarDay,
    lunarMonth,
    lunarYear,
    lunarLeap
  ];

}


function lunarText(date){

  try{

    const lunar =
      convertSolar2Lunar(
        date.getDate(),
        date.getMonth()+1,
        date.getFullYear(),
        7
      );

    return "Âm lịch: "
      + lunar[0]
      + "/"
      + lunar[1]
      + "/"
      + lunar[2];

  }catch(e){

    return "";

  }

}
