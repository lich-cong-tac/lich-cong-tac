<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b2d5c">
<title>Lịch công tác</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;background:#f4f7fb;color:#172033;font-family:"Be Vietnam Pro",Arial,sans-serif}
.header{background:linear-gradient(135deg,#082b59,#124d8f);color:#fff;text-align:center;padding:20px 15px;box-shadow:0 3px 12px #0002}
.header-title{font-size:28px;font-weight:800}.header-subtitle{margin-top:5px;font-size:13px;opacity:.9}
.container{max-width:1000px;margin:auto;padding:16px 13px}.section{margin-bottom:25px}
.loading{text-align:center;padding:70px 20px}.spinner{width:42px;height:42px;margin:auto auto 16px;border:4px solid #dce5ef;border-top-color:#0b4f91;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}.loading-text{font-size:18px;font-weight:600}
.error-box{display:none;background:#fff;margin:30px auto;padding:25px;border-radius:18px;border-left:6px solid #c62828;text-align:center;box-shadow:0 5px 18px #0001}
.error-title{font-size:22px;font-weight:800;color:#b71c1c}.error-text{font-size:16px;line-height:1.6;color:#666;margin:8px 0 17px}
.reload-btn{border:0;border-radius:12px;padding:13px 24px;background:#0b4f91;color:#fff;font:700 17px "Be Vietnam Pro";cursor:pointer}
.section-title{display:flex;align-items:center;gap:10px;margin-bottom:12px;color:#0b2d5c;font-size:25px;font-weight:800}
.section-title:before{content:"";width:6px;height:29px;border-radius:5px;background:#d4a72c}
.today-date{display:inline-block;background:#0b2d5c;color:#fff;padding:8px 12px;border-radius:9px;font-size:16px;font-weight:700;margin-bottom:12px}
.today-empty{background:#fff;border-radius:16px;padding:28px 20px;text-align:center;color:#777;font-size:17px;box-shadow:0 3px 12px #0001}
.event-card{background:#fff;border-radius:17px;margin-bottom:13px;padding:17px 14px;box-shadow:0 4px 15px #0001;border-left:5px solid #0b4f91}
.event-card.changed,.week-event.changed{border-left-color:#c62828}.event-top{display:flex;gap:11px}.time-box{flex:0 0 auto;min-width:82px;padding:10px 5px;text-align:center;background:#edf4fb;color:#0b4f91;border-radius:11px;font-size:28px;font-weight:800}
.event-main{flex:1;min-width:0}.event-title{font-size:27px;line-height:1.35;font-weight:800}.event-place{margin-top:8px;font-size:20px;line-height:1.45;color:#46556b}.event-people{margin-top:5px;font-size:18px;color:#5f6d7e}
.event-note{margin-top:8px;padding:9px 11px;background:#fff8e5;border-radius:9px;color:#8a6200;font-size:16px}.status{display:inline-block;margin-top:9px;padding:5px 10px;border-radius:20px;font-size:13px;font-weight:700;background:#e9f6ed;color:#28753a}.status.changed{background:#fdeaea;color:#b71c1c}
.week-day{margin-bottom:18px}.week-day-header{display:flex;align-items:center;gap:10px;margin-bottom:9px}.week-date-box{width:58px;min-width:58px;height:58px;background:#0b2d5c;color:#fff;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.week-date-number{font-size:24px;font-weight:800}.week-date-month{font-size:11px}.week-day-name{font-size:23px;font-weight:800;color:#0b2d5c}.week-today-label{margin-left:auto;background:#d4a72c;color:#fff;padding:5px 9px;border-radius:7px;font-size:12px;font-weight:800}
.week-event{background:#fff;border-radius:14px;margin-bottom:8px;padding:14px 12px;display:flex;gap:10px;box-shadow:0 3px 11px #0001;border-left:4px solid #0b4f91}.week-time{flex:0 0 72px;font-size:22px;font-weight:800;color:#0b4f91}.week-content{flex:1;min-width:0}.week-title{font-size:23px;line-height:1.4;font-weight:700}.week-place{margin-top:5px;font-size:19px;color:#5b6878}.week-note{margin-top:5px;color:#9a6a00;font-size:16px}
.footer{text-align:center;padding:15px 10px 30px;color:#7b8794;font-size:13px}
@media(max-width:430px){.header-title{font-size:26px}.event-title{font-size:25px}.event-place{font-size:19px}.time-box{min-width:76px;font-size:26px}.week-title{font-size:21px}.week-place{font-size:18px}}
</style>
</head>
<body>
<header class="header"><div class="header-title">LỊCH CÔNG TÁC</div><div class="header-subtitle">Lịch điều hành của Lãnh đạo</div></header>
<main class="container">
<div id="loading" class="loading"><div class="spinner"></div><div class="loading-text">Đang tải lịch công tác...</div></div>
<div id="errorBox" class="error-box"><div class="error-title">Không tải được lịch</div><div class="error-text">Kết nối tới dữ liệu lịch công tác bị gián đoạn.</div><button class="reload-btn" onclick="loadSchedule()">↻ Tải lại lịch</button></div>
<div id="content" style="display:none">
<section class="section"><div class="section-title">Hôm nay</div><div id="todayDate"></div><div id="todayEvents"></div></section>
<section class="section"><div class="section-title">Lịch tuần</div><div id="weekEvents"></div></section>
</div></main>
<div class="footer">Lịch công tác được cập nhật từ hệ thống điều hành</div>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbwnLLNPn7Vsxoqs9gOi0UH_iMtC_2it12QlHeBfUVyhiOalsnqyu9ga2u4OIVKN9WtJww/exec";
let scheduleData=[],callbackName=null,timeoutId=null;
document.addEventListener("DOMContentLoaded",loadSchedule);
function loadSchedule(){showLoading();cleanup();callbackName="scheduleCallback_"+Date.now();window[callbackName]=function(data){clearTimeout(timeoutId);scheduleData=Array.isArray(data)?data:[];renderAll();document.getElementById("loading").style.display="none";document.getElementById("content").style.display="block";cleanup()};let s=document.createElement("script");s.id="scheduleJsonp";s.src=API_URL+"?callback="+encodeURIComponent(callbackName)+"&t="+Date.now();s.onerror=showError;document.body.appendChild(s);timeoutId=setTimeout(showError,10000)}
function cleanup(){let s=document.getElementById("scheduleJsonp");if(s)s.remove();if(callbackName){try{delete window[callbackName]}catch(e){}}}
function showLoading(){document.getElementById("loading").style.display="block";document.getElementById("errorBox").style.display="none";document.getElementById("content").style.display="none"}
function showError(){clearTimeout(timeoutId);document.getElementById("loading").style.display="none";document.getElementById("errorBox").style.display="block";document.getElementById("content").style.display="none";cleanup()}
function parseDate(v){if(!v)return null;let t=String(v).trim(),p=t.split("/");if(p.length===3){let y=+p[2],m=+p[1]-1,d=+p[0];if(y<100)y+=2000;return new Date(y,m,d)}p=t.split("-");if(p.length===3)return new Date(+p[0],+p[1]-1,+p[2]);let d=new Date(t);return isNaN(d)?null:d}
function dateKey(d){return d?d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"):""}
function formatDate(d){return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear()}
function dayName(d){return["Chủ nhật","Thứ Hai","Thứ Ba","Thứ Tư","Thứ Năm","Thứ Sáu","Thứ Bảy"][d.getDay()]}
function parseTime(v){let m=String(v||"").match(/(\d{1,2})\s*[:h]\s*(\d{1,2})/i);return m? +m[1]*60 + +m[2]:99999}
function changed(x){let s=String(x.status||"").toLowerCase(),n=String(x.note||"").toLowerCase();return s.includes("thay đổi")||s.includes("thay doi")||n.includes("đổi")||n.includes("doi")}
function esc(v){return String(v||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function renderAll(){renderToday();renderWeek()}
function renderToday(){let n=new Date(),k=dateKey(n),e=scheduleData.filter(x=>{let d=parseDate(x.date);return d&&dateKey(d)===k}).sort((a,b)=>parseTime(a.time)-parseTime(b.time));document.getElementById("todayDate").innerHTML='<div class="today-date">'+dayName(n)+" • "+formatDate(n)+"</div>";document.getElementById("todayEvents").innerHTML=e.length?e.map(todayEvent).join(""):'<div class="today-empty">Hôm nay không có lịch công tác.</div>'}
function todayEvent(x){let c=changed(x),h='<div class="event-card '+(c?"changed":"")+'"><div class="event-top"><div class="time-box">'+esc(x.time)+'</div><div class="event-main"><div class="event-title">'+esc(x.title)+'</div>';if(x.place)h+='<div class="event-place">📍 '+esc(x.place)+'</div>';if(x.people)h+='<div class="event-people">👥 '+esc(x.people)+'</div>';if(x.note)h+='<div class="event-note">📝 '+esc(x.note)+'</div>';if(x.status)h+='<div class="status '+(c?"changed":"")+'">'+esc(x.status)+'</div>';return h+"</div></div></div>"}
function monday(d){let x=new Date(d),n=x.getDay();x.setDate(x.getDate()+(n===0?-6:1-n));x.setHours(0,0,0,0);return x}
function renderWeek(){let m=monday(new Date()),h="";for(let i=0;i<7;i++){let d=new Date(m);d.setDate(m.getDate()+i);h+=weekDay(d)}document.getElementById("weekEvents").innerHTML=h}
function weekDay(d){let k=dateKey(d),tk=dateKey(new Date()),e=scheduleData.filter(x=>{let z=parseDate(x.date);return z&&dateKey(z)===k}).sort((a,b)=>parseTime(a.time)-parseTime(b.time));let h='<div class="week-day"><div class="week-day-header"><div class="week-date-box"><div class="week-date-number">'+d.getDate()+'</div><div class="week-date-month">THG '+(d.getMonth()+1)+'</div></div><div class="week-day-name">'+dayName(d)+'</div>';if(k===tk)h+='<div class="week-today-label">HÔM NAY</div>';h+='</div>';h+=e.length?e.map(weekEvent).join(""):'<div style="color:#9aa5b1;font-size:15px;padding:5px">Không có lịch</div>';return h+"</div>"}
function weekEvent(x){let c=changed(x),h='<div class="week-event '+(c?"changed":"")+'"><div class="week-time">'+esc(x.time)+'</div><div class="week-content"><div class="week-title">'+esc(x.title)+'</div>';if(x.place)h+='<div class="week-place">📍 '+esc(x.place)+'</div>';if(x.note)h+='<div class="week-note">📝 '+esc(x.note)+'</div>';return h+"</div></div>"}
</script>
</body>
</html>
